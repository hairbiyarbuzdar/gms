<!DOCTYPE html>

<style>
        /* Optional minor atmospheric fade-in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-x-mobile md:p-margin-x">
<!-- 
      Transactional Page Intent: Navigation shell is strictly suppressed.
      Focus is purely on the authentication canvas.
    -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-dim rounded-lg p-stack-lg flex flex-col gap-stack-lg animate-fade-in">
<!-- Brand / Header Anchor -->
<header class="flex flex-col items-center justify-center text-center">
<div class="flex items-center gap-stack-sm mb-stack-xs text-primary">
<span class="material-symbols-outlined text-[32px] font-bold" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<h1 class="font-headline-md text-headline-md font-bold uppercase tracking-tight">Iron Reserve</h1>
</div>
<p class="font-body-sm text-body-sm text-secondary">Secure Administrative Access</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-secondary uppercase mb-stack-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary-fixed-dim text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface border border-outline-dim rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim outline-none transition-colors" id="email" name="email" placeholder="admin@ironreserve.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-secondary uppercase mb-stack-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary-fixed-dim text-[20px]">lock</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface border border-outline-dim rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-stack-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-DEFAULT border-outline-dim text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer group-hover:border-primary transition-colors" type="checkbox"/>
<span class="font-body-sm text-body-sm text-secondary group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed hover:underline transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="mt-stack-sm w-full bg-primary text-on-primary font-body-md text-body-md font-medium rounded-lg py-3 hover:bg-on-primary-fixed focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface transition-all flex justify-center items-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Alternative Action -->
<footer class="text-center pt-stack-md border-t border-outline-dim">
<p class="font-body-sm text-body-sm text-secondary">
                New staff member? 
                <a class="text-primary font-medium hover:underline hover:text-on-primary-fixed transition-colors" href="#">Contact Admin</a>
</p>
</footer>
</main>
</body></html>
